name: 发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要创建的 release tag，例如 v0.1.0
        required: true
      title:
        description: 给人看的发布标题
        required: false

permissions:
  contents: read

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 解析 release 元数据
        id: release
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_TITLE: ${{ github.event.inputs.title }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${DISPATCH_TAG}"
            release_title="${DISPATCH_TITLE:-${release_tag}}"
          else
            release_tag="${GITHUB_REF_NAME}"
            release_title="${GITHUB_REF_NAME}"
          fi

          if [ -z "${release_tag}" ]; then
            echo "Release tag is required" >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "title=${release_title}" >> "${GITHUB_OUTPUT}"

      - name: 构建 CLI 二进制
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          ./scripts/build-cli-release-archives.sh "${version}" dist/cli
          cli_asset_count="$(find dist/cli -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          if [ "${cli_asset_count}" -ne 6 ]; then
            echo "Expected 6 CLI release archives, found ${cli_asset_count}" >&2
            exit 1
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          assets=(
            dist/cli/*.tar.gz
            dist/cli/*.zip
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --draft=false
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              --draft=false
          fi
